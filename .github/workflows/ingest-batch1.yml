# Batch 1: end-of-day ingest for the AU market, M2 T6 (DAT-020 stages 1..9, DAT-002, DAT-003,
# PLT-016, PLT-072, PLT-076, BLD-024, D-057 decision 2).
# Triggers: the Worker's per-minute cron (the master clock, PLT-071) dispatches this workflow with
# `ref: release` at 17:30 Sydney. GL-07 (O-52): a GitHub FALLBACK `schedule:` at 18:15 Melbourne
# (both DST offsets, `node scripts/time/genWatchdogCron.mjs 18:15`) covers a Worker that did not
# dispatch; the `gate` job makes the other regime's line a no-op. The fallback cannot double-ingest:
# `prepare` reads the run record `batch1:AU:<date>` and a day that already succeeded is "done", and
# the `ingest-batch1` concurrency group serialises a late Worker dispatch against it.
# `workflow_dispatch` stays. Secrets are referenced ONLY in `env:` of the two steps that read or write the
# database; the Python fetch step has NO secrets and no database access.
# SEC-108 c: the production job checks out the latest approved deploy-production commit, not the
# release head. `deployment: false` gives the job the environment's secrets without creating a
# deployment record, so a data run never counts as an approved deploy (D-023, SEC-108 c).
# SEC-110: bars.json and request.json stay on the runner; nothing is uploaded as an artifact or
# cached. Logs carry counts and statuses only.
# Flow: (1) `prepare` reads the DB (market mode, success record for today's key, catch-up plan,
# source gate, universe) and writes request.json; (2) Python/yfinance fetches into bars.json;
# (2b) M4 T3: the same python step also fetches the S&P/ASX 200 into index.json, and a Node step
# fetches the ASIC short positions into short.json (both secret-free); (3) the Node writer validates and writes market data only (BLD-024). Step 3 also runs when the
# fetch failed or was not needed, so a skip or a failure is always recorded in a run record.
name: Ingest batch 1 (AU EOD)

on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # GL-07 (O-52): a scheduled run maps its cron line back to a slot and exits as a no-op on the line
  # of the other DST regime (PLT-019); a dispatch always runs. No secrets, no environment.
  gate:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/time
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Schedule gate
        id: gate
        run: node scripts/time/scheduleGate.mjs 18:15
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}

  production:
    needs: gate
    if: github.ref == 'refs/heads/release' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run per day at a time, never cancelling one in progress. The date-keyed
    # "already succeeded" check is made by the script (run record `batch1:AU:<Sydney date>`).
    concurrency:
      group: ingest-batch1
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: run the commit of the latest APPROVED deploy-production deployment, not the
      # release head. These two steps run only the tiny reviewed script, with github.token
      # alone (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Plan the fetch (read-only)
        id: plan
        run: node scripts/ingest/batch1.mjs prepare --request request.json
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.plan.outputs.fetch == 'true'
        with:
          python-version: "3.12"
      - name: Install the fetcher (pinned)
        if: steps.plan.outputs.fetch == 'true'
        run: pip install --no-cache-dir --require-hashes -r scripts/ingest/requirements.txt
      # No secrets here: this step only talks to the market-data source (DAT-103) and writes
      # bars.json. The throttle values come from the plan step's outputs, which are not secret.
      - name: Fetch bars (no secrets)
        if: steps.plan.outputs.fetch == 'true'
        run: python scripts/ingest/yahoo_fetch.py --request request.json --output bars.json --index-output index.json --actions-output actions.json
        env:
          YAHOO_CHUNK_SIZE: ${{ steps.plan.outputs.chunk_size }}
          YAHOO_MIN_GAP_S: ${{ steps.plan.outputs.min_gap_s }}
      # M4 T3: ASIC daily short positions (public source). No secrets, no database; it reads only
      # the date list of request.json. Runs even if the Yahoo fetch failed (independent source).
      - name: Fetch ASIC short positions (no secrets)
        if: ${{ !cancelled() && steps.plan.outputs.fetch == 'true' }}
        run: node scripts/ingest/asic_fetch.mjs --request request.json --output short.json
      - name: Ingest batch 1
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: node scripts/ingest/batch1.mjs run --bars bars.json --index index.json --short short.json --actions actions.json
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
          COMMIT_SHA: ${{ steps.approved.outputs.sha }}

  # M8 T9 (decision 30, 31; NFR-040): the staging job. The staging Worker dispatches `ref: main`
  # (SEC-017 b-s). Same flow as production, but: it checks out the dispatched `main` commit (staging
  # has no approval record; SEC-108 c applies to production only), uses the staging database, and
  # NEVER calls Yahoo, ASX or ASIC: one recorded AU trading day is read from the private fixtures
  # repo with the read-only token (f-r) and re-dated to the run's dates (scripts/ingest/recorded_day.mjs).
  # PRAXIS_ENV=staging is fixed here and the recorded-day script refuses to run without it.
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: ingest-batch1-staging
      cancel-in-progress: false
    environment:
      name: staging
      deployment: false
    env:
      PRAXIS_ENV: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Plan the fetch (read-only)
        id: plan
        run: node scripts/ingest/batch1.mjs prepare --request request.json
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_STAGING }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_STAGING }}
      - name: Check out the private fixtures repo (read-only)
        if: steps.plan.outputs.fetch == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}-fixtures
          token: ${{ secrets.FIXTURES_READ_TOKEN }}
          path: fixtures
          persist-credentials: false
      # No secrets and no network here: the recorded day replaces the Yahoo and ASIC fetch steps.
      - name: Read the recorded day (no secrets, no network)
        if: steps.plan.outputs.fetch == 'true'
        run: node scripts/ingest/recorded_day.mjs --request request.json --fixtures fixtures --output bars.json --index-output index.json --short-output short.json
      - name: Ingest batch 1
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: node scripts/ingest/batch1.mjs run --bars bars.json --index index.json --short short.json --actions actions.json
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_STAGING }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_STAGING }}
          COMMIT_SHA: ${{ github.sha }}
