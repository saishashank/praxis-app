# Branch-only proof of the self-hosted runtime (INFRA T4, T7, T9 rehearsal, T11; REQ\infra\INFRA_REQUIREMENT.md §14, §15).
# Runs on pushes to infra/selfhost and by hand. Real Docker on GitHub's runners: images built locally (nothing is
# pushed anywhere), a real sqld, the clock booted against it, the pre-deploy check run on a good and on a broken
# image, and the arm64 build on a native arm64 runner. No secret is read, no deploy key exists, the run token is
# read-only. Every value the stack needs is made up at run time (scripts/selfhost/predeploy-ci-env.mjs).
name: Self-host check

on:
  push:
    branches: [infra/selfhost]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-check-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLD_IMAGE: ghcr.io/tursodatabase/libsql-server:v0.24.32@sha256:dedf5273da945d90f3b85fe367ed8f821349117ac2c488bf43c4a6bf9f2123e0
  WEB_IMAGE: ghcr.io/saishashank/praxis-web:ci
  JOBS_IMAGE: ghcr.io/saishashank/praxis-jobs:ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build both images (amd64, local only)
        run: |
          set -eu
          # next/font/google fetches fonts at build time: retry the web build on a network hiccup (seen once on arm64).
          ( for n in 1 2 3; do
              docker build -f deploy/selfhost/Dockerfile.web -t "$WEB_IMAGE" . && exit 0
              echo "web build attempt $n failed"; sleep 20
            done; exit 1 ) > "$RUNNER_TEMP/build-web.log" 2>&1 &
          p1=$!
          docker build -f deploy/selfhost/Dockerfile.jobs --build-arg BUILD_COMMIT="$GITHUB_SHA" -t "$JOBS_IMAGE" . > "$RUNNER_TEMP/build-jobs.log" 2>&1 &
          p2=$!
          rc=0
          wait "$p1" || { echo "::error::praxis-web build failed"; tail -n 60 "$RUNNER_TEMP/build-web.log"; rc=1; }
          wait "$p2" || { echo "::error::praxis-jobs build failed"; tail -n 60 "$RUNNER_TEMP/build-jobs.log"; rc=1; }
          [ "$rc" = 0 ]
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep praxis
          echo "T_BUILT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Throwaway env files (random values made up here)
        run: node scripts/selfhost/predeploy-ci-env.mjs "$RUNNER_TEMP/env"

      # 1a. A real sqld, started with the same flags as docker-compose.prod.yml. The names main.sqld / auth.sqld /
      # sqld resolve to it on the runner (as the compose network aliases do in the containers).
      - name: Start sqld (flags of docker-compose.prod.yml)
        run: |
          set -eu
          docker network create ci-net
          docker pull "$SQLD_IMAGE"
          docker run -d --name sqld-ci --network ci-net \
            --network-alias sqld --network-alias main.sqld --network-alias auth.sqld \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:8081:8081 \
            --entrypoint /bin/sqld --user 666:666 -v sqld_ci:/var/lib/sqld \
            "$SQLD_IMAGE" \
            --http-listen-addr=0.0.0.0:8080 --admin-listen-addr=0.0.0.0:8081 \
            --enable-namespaces --db-path=/var/lib/sqld/data.sqld
          echo "127.0.0.1 sqld main.sqld auth.sqld" | sudo tee -a /etc/hosts > /dev/null
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then echo "sqld healthy after ${i} tries"; exit 0; fi
            sleep 1
          done
          echo "::error::sqld did not become healthy"; docker logs sqld-ci | tail -n 40; exit 1
      - name: The compose healthcheck of sqld works inside the container
        run: |
          set -eu
          docker exec sqld-ci id -u
          docker exec sqld-ci bash -c "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\r\n\r\n' >&3; head -n1 <&3 | grep -q ' 200 '"
          echo "healthcheck ok"

      - name: sqld, namespaces and migrations (main, auth; second run applies nothing)
        env:
          TURSO_MAIN_URL: http://main.sqld:8080
          TURSO_AUTH_URL: http://auth.sqld:8080
          SQLD_ADMIN_URL: http://127.0.0.1:8081
        run: |
          set -eu
          node scripts/db/migrate.mjs --db main --target sqld
          node scripts/db/migrate.mjs --db auth --target sqld
          node scripts/db/migrate.mjs --db main --target sqld | tee "$RUNNER_TEMP/again.txt"
          grep -q "applied 0" "$RUNNER_TEMP/again.txt"

      - name: T4 tests against the real sqld (foreign_keys = 1, namespace admin API)
        env:
          SQLD_TEST_URL: http://sqld:8080
          SQLD_TEST_ADMIN_URL: http://127.0.0.1:8081
          SQLD_TEST_NS: main
        run: node --test scripts/selfhost/sqld.test.mjs

      - name: Diagnostic, what a fresh namespace holds and that namespaces are isolated
        run: |
          set -eu
          cat > "$RUNNER_TEMP/ns-diag.mjs" <<'DIAG'
          import { ensureNamespace, dropNamespace, openNamespace } from "./scripts/selfhost/sqld.mjs";
          const admin = "http://127.0.0.1:8081";
          const names = ["diag-a", "diag-b"];
          for (const n of names) await ensureNamespace(admin, n);
          const open = (n) => openNamespace({ base: "http://sqld:8080", ns: n, mode: "host" });
          const a = open("diag-a");
          const b = open("diag-b");
          const list = async (c) => (await c.execute("SELECT type, name FROM sqlite_master")).rows.map((r) => r.type + ":" + r.name);
          console.log("fresh diag-a:", JSON.stringify(await list(a)));
          await a.execute("CREATE TABLE only_in_a (id INTEGER)");
          console.log("diag-a after create:", JSON.stringify(await list(a)));
          console.log("diag-b (must not see only_in_a):", JSON.stringify(await list(b)));
          for (const n of names) await dropNamespace(admin, n);
          a.close();
          b.close();
          DIAG
          cp "$RUNNER_TEMP/ns-diag.mjs" ./ns-diag.mjs
          node ./ns-diag.mjs
          rm -f ./ns-diag.mjs
      - name: Restore drill on the real sqld (synthetic source)
        env:
          SQLD_URL: http://sqld:8080
          SQLD_ADMIN_URL: http://127.0.0.1:8081
        run: node scripts/selfhost/restore-drill.mjs --source synthetic

      # 1b. The clock from the jobs image against that sqld.
      - name: A trap that records any call to api.github.com or api.resend.com
        run: |
          set -eu
          docker run -d --name trap --network ci-net \
            --network-alias api.github.com --network-alias api.resend.com \
            --entrypoint node "$JOBS_IMAGE" \
            -e "require('net').createServer(s=>{console.log('CONNECTION');s.destroy()}).listen(443,'0.0.0.0')"
      - name: Clock boots with CLOCK_ENABLED=0 (health 200, nothing read)
        run: |
          set -eu
          docker run -d --name clock0 --network ci-net -p 127.0.0.1:9100:9100 \
            --env-file "$RUNNER_TEMP/env/jobs.env" -e CLOCK_ENABLED=0 \
            --tmpfs /app/node_modules/.cache:uid=10001,gid=10001,size=512m \
            "$JOBS_IMAGE"
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o "$RUNNER_TEMP/health0.json" -w '%{http_code}' http://127.0.0.1:9100/health || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ -f "$RUNNER_TEMP/health0.json" ] && cat "$RUNNER_TEMP/health0.json"; echo
          [ "$code" = 200 ] || { docker ps -a; docker logs clock0 2>&1 | tail -n 60; echo "::error::clock health is not 200"; exit 1; }
          node -e "const h=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/health0.json','utf8')); if(h.enabled!==false||h.runtime!=='selfhost'||h.lastTick!==null||h.running.length!==0) process.exit(1)"
          docker rm -f clock0 > /dev/null
      - name: Clock with CLOCK_ENABLED=1 and no clock_owner (cloud owns it) stays in standby
        run: |
          set -eu
          docker run -d --name clock1 --network ci-net -p 127.0.0.1:9100:9100 \
            --env-file "$RUNNER_TEMP/env/jobs.env" -e CLOCK_ENABLED=1 \
            --tmpfs /app/node_modules/.cache:uid=10001,gid=10001,size=512m \
            "$JOBS_IMAGE"
          ok=0
          for i in $(seq 1 90); do
            curl -s -o "$RUNNER_TEMP/health1.json" http://127.0.0.1:9100/health || true
            if node -e "const h=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/health1.json','utf8')); process.exit(h.owner==='cloud'&&h.lastTick?0:1)" 2> /dev/null; then ok=1; break; fi
            sleep 2
          done
          [ -f "$RUNNER_TEMP/health1.json" ] && cat "$RUNNER_TEMP/health1.json"; echo
          [ "$ok" = 1 ] || { docker logs clock1 2>&1 | tail -n 80; echo "::error::clock did not reach standby"; exit 1; }
          sleep 20
          curl -fsS http://127.0.0.1:9100/health > "$RUNNER_TEMP/health1.json"
          node -e "const h=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/health1.json','utf8')); if(h.runtime!=='selfhost'||h.owner!=='cloud'||h.running.length!==0||h.queued!==0) { console.error('not standby'); process.exit(1) }"
          # no job was started: the lease table has no run
          TURSO_MAIN_URL=http://main.sqld:8080 node -e "
            import('@libsql/client').then(async ({createClient})=>{
              const c=createClient({url:process.env.TURSO_MAIN_URL});
              const r=await c.execute('SELECT COUNT(*) AS n FROM job_run');
              console.log('job_run rows:', r.rows[0].n);
              process.exit(Number(r.rows[0].n)===0?0:1);
            })"
          # no outbound call to GitHub or Resend
          if docker logs trap 2>&1 | grep -q CONNECTION; then echo "::error::the clock called api.github.com or api.resend.com"; exit 1; fi
          docker logs clock1 2>&1 | tail -n 15
          docker rm -f clock1 trap > /dev/null

      # 1e. Signed-in smoke, in this throwaway stack only: web from the built image on the real sqld (migrated main and
      # auth), a test user (owner@praxis.test) and the session cookie Auth.js would issue for it, both made here at run
      # time (scripts/selfhost/seed-session.mjs). Home, Picks and Market must answer 200 with their own heading.
      - name: Signed-in smoke test (seeded test user and session, throwaway stack only)
        run: |
          set -eu
          echo "127.0.0.1 web" | sudo tee -a /etc/hosts > /dev/null
          set -a
          . "$RUNNER_TEMP/env/web.env"
          set +a
          node scripts/selfhost/seed-session.mjs "$RUNNER_TEMP/session.cookie"
          echo "::add-mask::$(cat "$RUNNER_TEMP/session.cookie")"
          docker run -d --name web-ci --network ci-net --network-alias web -p 127.0.0.1:3000:3000 \
            --env-file "$RUNNER_TEMP/env/web.env" -e NODE_OPTIONS=--max-old-space-size=768 \
            --read-only --tmpfs /tmp --tmpfs /app/.next/cache:uid=10001,gid=10001,size=128m "$WEB_IMAGE"
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://web:3000/api/health || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { docker logs web-ci 2>&1 | tail -n 40; echo "::error::web did not become healthy"; exit 1; }
          SMOKE_SESSION_COOKIE="$(cat "$RUNNER_TEMP/session.cookie")" node scripts/selfhost/smoke.mjs http://web:3000 | tee "$RUNNER_TEMP/smoke-in.txt"
          grep -q 'PASS Home (signed in): HTTP 200, heading found' "$RUNNER_TEMP/smoke-in.txt"
          grep -q 'PASS Picks (signed in): HTTP 200, heading found' "$RUNNER_TEMP/smoke-in.txt"
          grep -q 'PASS Market (signed in): HTTP 200, heading found' "$RUNNER_TEMP/smoke-in.txt"
          # Negative control: a cookie the app cannot decrypt must NOT pass (the pages then send to sign-in).
          bad="authjs.session-token=$(openssl rand -hex 120)"
          set +e
          SMOKE_SESSION_COOKIE="$bad" node scripts/selfhost/smoke.mjs http://web:3000 > "$RUNNER_TEMP/smoke-bad.txt"
          rc=$?
          set -e
          [ "$rc" = 1 ] || { cat "$RUNNER_TEMP/smoke-bad.txt"; echo "::error::a forged cookie passed the smoke test"; exit 1; }
          echo "forged cookie refused by the smoke test, as it must be"
          docker rm -f web-ci > /dev/null

      # 1c / 1d. The T7 pre-deploy check: good image passes, broken image fails and leaves nothing behind.
      - name: Pre-deploy check, good image (with ZAP) must exit 0
        env:
          PRAXIS_ENV_DIR: ${{ runner.temp }}/env
          PRAXIS_COMPOSE_DIR: deploy/selfhost
          PRAXIS_SCRIPTS_DIR: scripts/selfhost
          PRAXIS_CHECK_TMP: ${{ runner.temp }}/check
        run: |
          set -eu
          docker rm -f sqld-ci > /dev/null 2>&1 || true
          node scripts/selfhost/predeploy.mjs --ci --web-image "$WEB_IMAGE" --jobs-image "$JOBS_IMAGE"
          echo "T_CHECK=$(date +%s)" >> "$GITHUB_ENV"
      - name: Pre-deploy check, broken image must exit 1 and leave no praxis-check leftovers
        env:
          PRAXIS_ENV_DIR: ${{ runner.temp }}/env
          PRAXIS_COMPOSE_DIR: deploy/selfhost
          PRAXIS_SCRIPTS_DIR: scripts/selfhost
          PRAXIS_CHECK_TMP: ${{ runner.temp }}/check-broken
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/broken"
          {
            echo "FROM $WEB_IMAGE"
            echo 'CMD ["node","-e","require(\"http\").createServer((q,s)=>{s.statusCode=500;s.end(\"x\")}).listen(3000,\"0.0.0.0\")"]'
          } > "$RUNNER_TEMP/broken/Dockerfile"
          docker build -t ghcr.io/saishashank/praxis-web:ci-broken "$RUNNER_TEMP/broken"
          set +e
          node scripts/selfhost/predeploy.mjs --ci --web-image ghcr.io/saishashank/praxis-web:ci-broken --jobs-image "$JOBS_IMAGE"
          rc=$?
          set -e
          echo "predeploy exit code: $rc"
          [ "$rc" = 1 ] || { echo "::error::the broken image gave exit $rc, expected 1"; exit 1; }
          left=$( { docker ps -a --format '{{.Names}}'; docker network ls --format '{{.Name}}'; docker volume ls --format '{{.Name}}'; } | grep praxis-check || true)
          if [ -n "$left" ]; then echo "::error::leftovers after the failed check:"; echo "$left"; exit 1; fi
          echo "no praxis-check containers, networks or volumes left"

      - name: Timing (first proxy for the 60-minute move, INFRA §15.5)
        if: always()
        run: |
          now=$(date +%s)
          echo "TIMING amd64: build=$(( ${T_BUILT:-$now} - T0 ))s total=$(( now - T0 ))s ($(( (now - T0) / 60 )) min)"
          echo "### amd64 timing: build $(( ${T_BUILT:-$now} - T0 )) s, total $(( now - T0 )) s" >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}'); do echo "== $c"; docker logs --tail 40 "$c" 2>&1 | sed 's/[A-Za-z0-9_-]\{40,\}/<redacted>/g'; done

  # sqld verifies JWTs (SQLD_AUTH_JWT_KEY, as in production): a throwaway Ed25519 pair is made here, sqld trusts the
  # public half, and scripts/selfhost/sqld-jwt.test.mjs proves that no token, a token of another key and an expired
  # token are refused while a valid one works through sqld.mjs (openNamespace) and migrate.mjs.
  sqld-jwt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Throwaway key pairs (good = trusted by sqld, other = not), made up here
        run: node scripts/selfhost/jwt.mjs gen "$RUNNER_TEMP/keys" good other
      - name: Start sqld with SQLD_AUTH_JWT_KEY (flags of docker-compose.prod.yml)
        run: |
          set -eu
          docker pull "$SQLD_IMAGE"
          openssl rand -hex 24 > "$RUNNER_TEMP/keys/admin.key"
          docker run -d --name sqld-jwt -p 127.0.0.1:8080:8080 -p 127.0.0.1:8081:8081 \
            -e SQLD_AUTH_JWT_KEY="$(cat "$RUNNER_TEMP/keys/good.pub")" \
            -e LIBSQL_ADMIN_AUTH_KEY="$(cat "$RUNNER_TEMP/keys/admin.key")" \
            --entrypoint /bin/sqld --user 666:666 -v sqld_jwt:/var/lib/sqld \
            "$SQLD_IMAGE" \
            --http-listen-addr=0.0.0.0:8080 --admin-listen-addr=0.0.0.0:8081 \
            --enable-namespaces --db-path=/var/lib/sqld/data.sqld
          echo "127.0.0.1 jwtsqld main.jwtsqld auth.jwtsqld" | sudo tee -a /etc/hosts > /dev/null
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://127.0.0.1:8080/health; then echo "sqld answers after ${i} tries"; exit 0; fi
            sleep 1
          done
          echo "::error::sqld did not answer"; docker logs sqld-jwt | tail -n 40; exit 1
      - name: JWT tests (refused without a token, with another key's token, expired; valid works)
        env:
          SQLD_JWT_BASE: http://jwtsqld:8080
          SQLD_JWT_ADMIN: http://127.0.0.1:8081
          SQLD_JWT_KEYS: ${{ runner.temp }}/keys
        run: |
          set -eu
          SQLD_JWT_ADMIN_AUTH="Basic $(cat "$RUNNER_TEMP/keys/admin.key")" node --test scripts/selfhost/sqld-jwt.test.mjs
      - name: Container log on failure
        if: failure()
        run: docker logs --tail 60 sqld-jwt 2>&1 | sed 's/[A-Za-z0-9_-]\{40,\}/<redacted>/g'

  # The whole box, as bootstrap.sh builds it (a fresh `ubuntu-latest` runner: Docker and Node are already on it, the
  # OS hardening step is skipped, the backup restore is skipped because it needs the Owner's key), then Caddy, the
  # runtime switch, and `praxis deploy` by digest with rollback and automatic revert, all against it. Images are
  # built here and served from a local registry:2 instead of GHCR. No secret, no real service; sqld verifies JWTs.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build both images (amd64, local only)
        run: |
          set -eu
          ( for n in 1 2 3; do
              docker build -f deploy/selfhost/Dockerfile.web -t "$WEB_IMAGE" . && exit 0
              echo "web build attempt $n failed"; sleep 20
            done; exit 1 ) > "$RUNNER_TEMP/build-web.log" 2>&1 &
          p1=$!
          docker build -f deploy/selfhost/Dockerfile.jobs --build-arg BUILD_COMMIT="$GITHUB_SHA" -t "$JOBS_IMAGE" . > "$RUNNER_TEMP/build-jobs.log" 2>&1 &
          p2=$!
          rc=0
          wait "$p1" || { echo "::error::praxis-web build failed"; tail -n 60 "$RUNNER_TEMP/build-web.log"; rc=1; }
          wait "$p2" || { echo "::error::praxis-jobs build failed"; tail -n 60 "$RUNNER_TEMP/build-jobs.log"; rc=1; }
          [ "$rc" = 0 ]
          echo "T_BUILT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Local registry (registry:2, pinned) and the release images in it
        run: |
          set -eu
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/v2/ > /dev/null && break; sleep 1; done
          for img in web jobs; do
            docker tag "ghcr.io/saishashank/praxis-$img:ci" "localhost:5000/praxis-$img:$GITHUB_SHA"
            docker push -q "localhost:5000/praxis-$img:$GITHUB_SHA"
          done
          curl -fsS http://127.0.0.1:5000/v2/_catalog
      - name: Throwaway env files for /srv/praxis/env (random values, a JWT pair for sqld, made up here)
        run: |
          set -eu
          node scripts/selfhost/predeploy-ci-env.mjs "$RUNNER_TEMP/stack-env" --full deploy/selfhost/env.example \
            --jwt "$RUNNER_TEMP/keys" --refresh-url http://fake-turso:8080
          sudo install -d -m 700 /srv/praxis/env
          sudo install -m 600 "$RUNNER_TEMP"/stack-env/web.env "$RUNNER_TEMP"/stack-env/jobs.env "$RUNNER_TEMP"/stack-env/sqld.env /srv/praxis/env/
      - name: bootstrap.sh, end to end (timed)
        run: |
          set -eo pipefail
          t0=$(date +%s)
          sudo env PRAXIS_IMAGE_PREFIX=localhost:5000 bash deploy/selfhost/bootstrap.sh \
            --release "$GITHUB_SHA" --domain localhost --skip-os-hardening --skip-restore 2>&1 | tee "$RUNNER_TEMP/bootstrap.log"
          t1=$(date +%s)
          echo "T_BOOT=$(( t1 - t0 ))" >> "$GITHUB_ENV"
          echo "TIMING bootstrap.sh: $(( t1 - t0 )) s ($(( (t1 - t0) / 60 )) min $(( (t1 - t0) % 60 )) s)"
          echo "### bootstrap.sh on the CI runner: $(( t1 - t0 )) s ($(( (t1 - t0) / 60 )) min), images from a local registry, no backup restore, no OS hardening" >> "$GITHUB_STEP_SUMMARY"
      - name: web, clock, sqld and caddy are healthy; the clock is off; the operator CLI answers (JWT in use)
        run: |
          set -eu
          for s in web clock sqld caddy; do
            st=$(docker inspect -f '{{.State.Health.Status}}' "praxis-prod-$s-1")
            echo "$s: $st"
            [ "$st" = healthy ] || { echo "::error::$s is $st"; exit 1; }
          done
          docker exec praxis-prod-clock-1 node -e "fetch('http://127.0.0.1:9100/health').then(r=>r.text()).then(t=>process.stdout.write(t))" > "$RUNNER_TEMP/clock-health.json"
          cat "$RUNNER_TEMP/clock-health.json"; echo
          node -e "const h=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/clock-health.json','utf8')); if(h.enabled!==false||h.runtime!=='selfhost') process.exit(1)"
          sudo /srv/praxis/bin/praxis status
          sudo /srv/praxis/bin/praxis owner
          # sqld refuses a call without a token (the stack runs with SQLD_AUTH_JWT_KEY)
          code=$(docker run --rm --network praxis-prod --entrypoint node "$JOBS_IMAGE" -e "fetch('http://main.sqld:8080/v2/pipeline',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({requests:[{type:'execute',stmt:{sql:'SELECT 1'}},{type:'close'}]})}).then(r=>console.log(r.status))")
          echo "sqld without a token: HTTP $code"
          [ "$code" = 401 ] || [ "$code" = 403 ]
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
      - name: The sqld admin key was generated by bootstrap (never printed) and restore-latest --replace is guarded
        run: |
          set -eu
          key="$(sudo sed -n 's/^LIBSQL_ADMIN_AUTH_KEY=//p' /srv/praxis/env/sqld.env | head -n1)"
          [ -n "$key" ] || { echo "::error::bootstrap did not generate LIBSQL_ADMIN_AUTH_KEY"; exit 1; }
          echo "::add-mask::$key"
          [ "$(sudo sed -n 's/^SQLD_ADMIN_AUTH=//p' /srv/praxis/env/jobs.env | head -n1)" = "Basic $key" ]
          sudo sha256sum /srv/praxis/env/sqld.env | awk '{print $1}' > "$RUNNER_TEMP/sqld-env.sha"
          bash scripts/selfhost/ci/replace-drill.sh
      - name: Caddy with the repo Caddyfile and its internal CA (TLS, headers, no route to sqld or the clock)
        run: bash scripts/selfhost/ci/caddy-check.sh
      - name: switch.sh, cloud to selfhost and back (a second local sqld stands in for the cloud database)
        run: bash scripts/selfhost/ci/switch-drill.sh
      - name: praxis deploy by digest from a local registry, rollback, failed check, automatic revert
        run: bash scripts/selfhost/ci/deploy-drill.sh "$GITHUB_SHA"
      - name: bootstrap.sh a second time, on the working box, without --skip-restore (idempotent; keeps pins; no token left behind)
        run: |
          set -eo pipefail
          env_before="$(sudo cat /srv/praxis/compose/.env)"
          ids_before="$(docker inspect -f '{{.Id}}' praxis-prod-web-1 praxis-prod-clock-1 praxis-prod-sqld-1 | tr '\n' ' ')"
          key_before="$(sudo sha256sum /srv/praxis/env/sqld.env | awk '{print $1}')"
          tok="$(openssl rand -hex 20)"
          echo "::add-mask::$tok"
          t0=$(date +%s)
          sudo env PRAXIS_IMAGE_PREFIX=localhost:5000 GHCR_USER=ci-user GHCR_TOKEN="$tok" bash deploy/selfhost/bootstrap.sh \
            --release "$GITHUB_SHA" --domain localhost --skip-os-hardening 2>&1 | tee "$RUNNER_TEMP/bootstrap2.log"
          t1=$(date +%s)
          echo "TIMING second bootstrap.sh: $(( t1 - t0 )) s"
          grep -q 'restore skipped' "$RUNNER_TEMP/bootstrap2.log" || { echo "::error::the second run did not skip the restore"; exit 1; }
          [ "$env_before" = "$(sudo cat /srv/praxis/compose/.env)" ] || { echo "::error::compose/.env changed (pins lost?)"; exit 1; }
          [ "$ids_before" = "$(docker inspect -f '{{.Id}}' praxis-prod-web-1 praxis-prod-clock-1 praxis-prod-sqld-1 | tr '\n' ' ')" ] || { echo "::error::containers were recreated"; exit 1; }
          [ "$key_before" = "$(sudo sha256sum /srv/praxis/env/sqld.env | awk '{print $1}')" ] || { echo "::error::sqld.env changed on the second run"; exit 1; }
          if sudo grep -rqF "$tok" /root/.docker /home/runner/.docker 2> /dev/null; then echo "::error::the registry token is in a docker config file"; exit 1; fi
          echo "second run: no-op, pins kept, admin key kept, token not left in /root/.docker"
          for s in web clock sqld caddy; do [ "$(docker inspect -f '{{.State.Health.Status}}' "praxis-prod-$s-1")" = healthy ] || { echo "::error::$s unhealthy"; exit 1; }; done
      - name: Timing
        if: always()
        run: |
          now=$(date +%s)
          echo "TIMING stack: build=$(( ${T_BUILT:-$now} - T0 )) s, bootstrap=${T_BOOT:-?} s, total=$(( now - T0 )) s ($(( (now - T0) / 60 )) min)"
          echo "### stack job: build $(( ${T_BUILT:-$now} - T0 )) s, bootstrap ${T_BOOT:-?} s, total $(( now - T0 )) s" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: |
          sudo cat /srv/praxis/state/last-deploy.log 2>/dev/null || true
          for c in $(docker ps -a --format '{{.Names}}'); do echo "== $c"; docker logs --tail 40 "$c" 2>&1 | sed 's/[A-Za-z0-9_-]\{40,\}/<redacted>/g'; done

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Machine is aarch64
        run: uname -m && [ "$(uname -m)" = aarch64 ]
      - name: Build praxis-jobs natively (pip --require-hashes with requirements-arm64.txt)
        run: docker build -f deploy/selfhost/Dockerfile.jobs --build-arg BUILD_COMMIT="$GITHUB_SHA" -t "$JOBS_IMAGE" .
      - name: Build praxis-web natively (retried, fonts are fetched at build time)
        run: |
          for n in 1 2 3; do
            docker build -f deploy/selfhost/Dockerfile.web -t "$WEB_IMAGE" . && exit 0
            echo "web build attempt $n failed"; sleep 20
          done
          exit 1
      - name: Python and Node inside the jobs image
        run: |
          set -eu
          docker run --rm --entrypoint python "$JOBS_IMAGE" -c "import platform, yfinance, pandas, numpy, curl_cffi; print(platform.machine(), 'imports ok')"
          docker run --rm --entrypoint node "$JOBS_IMAGE" --version
      - name: Clock boots on arm64 with CLOCK_ENABLED=0
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/env"
          # Minimal made-up environment: the clock only serves health with CLOCK_ENABLED=0.
          {
            echo "PRAXIS_RUNTIME=selfhost"
            echo "TURSO_MAIN_URL=http://main.sqld:8080"
            echo "TURSO_MAIN_TOKEN=$(openssl rand -hex 16)"
            echo "APP_BASE_URL=http://web:3000"
            echo "WORKER_HMAC_SECRET=$(openssl rand -hex 16)"
            echo "EMAIL_PROVIDER=mock"
            echo "EMAIL_LIVE=0"
          } > "$RUNNER_TEMP/env/jobs.env"
          docker run -d --name clock0 -p 127.0.0.1:9100:9100 \
            --env-file "$RUNNER_TEMP/env/jobs.env" -e CLOCK_ENABLED=0 \
            --tmpfs /app/node_modules/.cache:uid=10001,gid=10001,size=512m \
            "$JOBS_IMAGE"
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o "$RUNNER_TEMP/health.json" -w '%{http_code}' http://127.0.0.1:9100/health || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ -f "$RUNNER_TEMP/health.json" ] && cat "$RUNNER_TEMP/health.json"; echo
          [ "$code" = 200 ] || { docker ps -a; docker logs clock0 2>&1 | tail -n 60; echo "::error::clock health is not 200"; exit 1; }
      - name: Timing
        if: always()
        run: |
          now=$(date +%s)
          echo "TIMING arm64: total=$(( now - T0 ))s ($(( (now - T0) / 60 )) min)"
          echo "### arm64 timing: total $(( now - T0 )) s" >> "$GITHUB_STEP_SUMMARY"

  shell-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n on every host script
        run: |
          set -eu
          for f in deploy/selfhost/*.sh deploy/selfhost/bin/praxis scripts/selfhost/ci/*.sh; do bash -n "$f" && echo "syntax ok: $f"; done
      - name: shellcheck (errors and warnings)
        run: |
          set -eu
          shellcheck --version
          shellcheck -S warning deploy/selfhost/*.sh deploy/selfhost/bin/praxis scripts/selfhost/ci/*.sh
