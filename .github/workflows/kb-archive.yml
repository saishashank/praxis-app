# KB archive (M6 T13, KB-001..003, EML-015, PLT-022a; D-116 draft). workflow_dispatch ONLY: from M6
# the Worker's per-minute cron (PLT-071) may dispatch it with `ref: release` once the Owner enables its
# slot (22:15, disabled); until then run it by hand from the Actions tab on the release branch. It has
# no `schedule:` trigger (PLT-015).
# What it does: regenerates the knowledge-base `document` versions from the database and commits only
# the CHANGED files under `knowledge/` in the PRIVATE data repo (`<repo>-data`) through the Git Data API,
# one fast-forward commit, nothing deleted, token sent only to api.github.com. The code repo is never
# written, so an archive never triggers a deployment (AT-05a); the data repo has no Vercel project and
# no workflows (Owner confirms).
# SEC-108 c: the production job checks out the latest approved deploy-production commit, not the
# release head. `deployment: false` gives the job the environment's secrets without creating a
# deployment record, so an archive run never counts as an approved deploy (D-023).
# The database and data-repo secrets are referenced ONLY in `env:` of the one archive step.
# SEC-110: nothing is uploaded as an artifact or cached; the log carries counts and statuses only.
name: KB archive

on: workflow_dispatch

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    # One run at a time, never cancelling one in progress (the script is idempotent).
    concurrency:
      group: kb-archive
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: run the commit of the latest APPROVED deploy-production deployment, not the
      # release head. These two steps run only the tiny reviewed script, with github.token
      # alone (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with secrets.
      - name: KB archive
        run: node scripts/kb/archive.mjs
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN_PROD }}
          DATA_REPO: ${{ github.repository }}-data

  # M8 T9 (decision 30): the staging job. The staging Worker dispatches `ref: main`, so this file
  # needs a job that is selected there. Nothing runs on staging for this workflow: KB archive (it writes to the data repo, which staging must not touch).
  # The job references no secret and checks out nothing; it only prints a notice, so a staging
  # dispatch ends green and visibly does nothing. PRAXIS_ENV=staging is fixed for the audit trail.
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: kb-archive-staging
      cancel-in-progress: false
    environment:
      name: staging
      deployment: false
    env:
      PRAXIS_ENV: staging
    steps:
      - name: Nothing to run on staging
        run: echo "kb-archive has no staging variant (NFR-040, SEC-017); nothing was run."
