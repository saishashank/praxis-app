# Build the self-hosted runtime images (INFRA §10, §13). BUILD ONLY: this workflow never deploys,
# never reads a repository secret and holds no deploy key. It pushes praxis-web and praxis-jobs to GHCR
# tagged with the commit SHA (never `latest`); the Owner (or an approved interactive session) deploys
# on the server with `praxis deploy <sha>`.
# The only credential is the run's own GITHUB_TOKEN with `packages: write` on the two jobs below.
# Each architecture is built NATIVELY (amd64 and arm64 runners, no QEMU emulation, review S14) and pushed under a
# per-architecture tag; the manifest job then joins them under the commit SHA tag (never `latest`).
name: Build self-host images

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-selfhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release' }}
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lower-case; the owner part comes from the repository, not from an input.
      - name: Work out image names
        id: meta
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          # The jobs image needs hashed Python requirements for each architecture (deploy/selfhost/ARM64.md).
          # Until requirements-arm64.txt exists, it is built for amd64 only; the web image is always both.
          if [ "${{ matrix.arch }}" = "amd64" ] || [ -f scripts/ingest/requirements-arm64.txt ]; then
            echo "jobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=false" >> "$GITHUB_OUTPUT"
            echo "::warning::scripts/ingest/requirements-arm64.txt is missing: praxis-jobs is built for linux/amd64 only (see deploy/selfhost/ARM64.md)"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push praxis-web (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/selfhost/Dockerfile.web
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/praxis-web:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true

      - name: Build and push praxis-jobs (${{ matrix.arch }})
        if: ${{ steps.meta.outputs.jobs == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/selfhost/Dockerfile.jobs
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/praxis-jobs:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true

  # Joins the per-architecture images under the commit SHA tag (one multi-arch manifest per image).
  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create the multi-arch manifests
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          prefix="ghcr.io/${owner}"
          docker buildx imagetools create -t "${prefix}/praxis-web:${GITHUB_SHA}" "${prefix}/praxis-web:${GITHUB_SHA}-amd64" "${prefix}/praxis-web:${GITHUB_SHA}-arm64"
          jobs_sources="${prefix}/praxis-jobs:${GITHUB_SHA}-amd64"
          if [ -f scripts/ingest/requirements-arm64.txt ]; then
            jobs_sources="$jobs_sources ${prefix}/praxis-jobs:${GITHUB_SHA}-arm64"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "${prefix}/praxis-jobs:${GITHUB_SHA}" $jobs_sources
          docker buildx imagetools inspect "${prefix}/praxis-web:${GITHUB_SHA}" | head -20
