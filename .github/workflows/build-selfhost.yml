# Build the self-hosted runtime images (INFRA §10, §13). BUILD ONLY: this workflow never deploys,
# never reads a repository secret and holds no deploy key. It pushes praxis-web and praxis-jobs to GHCR
# tagged with the commit SHA (never `latest`); the Owner (or an approved interactive session) deploys
# on the server with `praxis deploy <sha>`.
# The only credential is the run's own GITHUB_TOKEN with `packages: write` on this job.
name: Build self-host images

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-selfhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lower-case; the owner part comes from the repository, not from an input.
      - name: Work out image names and platforms
        id: meta
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          # The jobs image needs hashed Python requirements for each architecture (deploy/selfhost/ARM64.md).
          # Until requirements-arm64.txt exists, it is built for amd64 only; the web image is always both.
          if [ -f scripts/ingest/requirements-arm64.txt ]; then
            echo "jobs_platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "jobs_platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "::warning::scripts/ingest/requirements-arm64.txt is missing: praxis-jobs is built for linux/amd64 only (see deploy/selfhost/ARM64.md)"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push praxis-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/selfhost/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/praxis-web:${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true

      - name: Build and push praxis-jobs
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/selfhost/Dockerfile.jobs
          platforms: ${{ steps.meta.outputs.jobs_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/praxis-jobs:${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
