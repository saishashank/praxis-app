# OWASP ZAP baseline (M8 T12; docs/M8_design.md 2.3, decisions 7, 37, 38; AT-29, SEC-107, SEC-110).
# One passive baseline scan (M18 OPS-107 / D-964: there is no staging, so the staging job is gone):
#   local    on every push to `build` and `main`: the production build of this commit, started on
#            the runner with throwaway databases and per-run random secrets (no real service, no
#            repository secret), AUTHENTICATED as the seeded viewer test identity (TST-113 re-homed:
#            scripts/ci/zap-run.mjs mints the session for the local app). Required by the release gate
#            as `zap-local` on the commit being released: the step "Scan the local build as the viewer
#            test identity" must have succeeded, so a scan that fell back to anonymous does not pass.
# Output is ONLY the job summary, produced by scripts/ci/zap-summary.mjs: rule id, rule name, risk
# and finding count per rule. No URL, header value, cookie or evidence; ZAP's own output is
# discarded and the report file (which does hold URLs) is deleted at the end and never uploaded.
# High findings fail the job unless scripts/ci/zap-exceptions.json lists the rule with a reason and
# an expiry of at most 30 days (decision 38). The container is pinned by digest (Apache-2.0).
# No repository secret and no environment: every secret is generated by the run and stays in memory.
name: ZAP baseline

on:
  push:
    branches: [build, main]

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # ZAP image pinned by digest (D-814): the multi-arch index of ghcr.io/zaproxy/zaproxy:stable read on
  # 2026-11-02. To move to a newer release, read the new index digest (`docker buildx imagetools inspect
  # ghcr.io/zaproxy/zaproxy:<release>`) and replace it here. The job still runs only once the repo
  # variable ZAP_IMAGE_PINNED is true (D-158), an Owner setting.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238

jobs:
  local:
    # Skipped (green) until the ZAP image digest above is pinned and the repo variable
    # ZAP_IMAGE_PINNED is set to true (D-158), so a push never fails on the placeholder digest.
    if: github.event_name == 'push' && vars.ZAP_IMAGE_PINNED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: zap-local-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Scan the local build as the viewer test identity
        run: node scripts/ci/zap-run.mjs local
      - name: Summary (rule, risk, count only)
        run: node scripts/ci/zap-summary.mjs "$RUNNER_TEMP/zap/zap.json" --label "local build"
      - name: Delete the report
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/zap"
