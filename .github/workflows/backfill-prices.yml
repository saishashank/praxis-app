# Price-history backfill (M4 T16a, D-092 draft; D-086, DAT-125, DAT-126, DAT-140).
# workflow_dispatch ONLY: the Worker's per-minute cron (the master clock, PLT-071) can dispatch it
# with `ref: release` once the Owner enables its slot (disabled by default). It has no `schedule:`
# trigger (PLT-015). Same security pattern as backfill-history.yml: secrets are referenced ONLY in
# `env:` of the two steps that read or write the database / the private data repository; the
# Yahoo fetch step has NO secrets and no database access.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release
# head. `deployment: false` gives the job the environment's secrets without creating a deployment
# record, so a data run never counts as an approved deploy (D-023).
# SEC-110: plan.json and prices.json stay on the runner; nothing is uploaded or cached. Logs carry
# counts and statuses only.
# (1) `plan` reads the database (cursor, cap, source gate: a source not accepted at O-26 records
# `source_off` and nothing is fetched); (2) one month of Yahoo bars (auto_adjust=False, with splits)
# is fetched with no secrets; (3) `commit` reconstructs raw prices (D-086), writes the write-once
# month file in the private data repo and moves the cursor.
name: Backfill prices (AU)

on: workflow_dispatch

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. Each month commit is
    # write-once and its cursor move is atomic, so a repeat is a no-op.
    concurrency:
      group: backfill-prices
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Plan the fetch (read-only)
        id: plan
        run: node scripts/backfill/prices.mjs plan --out plan.json
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
      # No secrets here: this step only talks to Yahoo and writes prices.json on the runner. It
      # stops at the first rate limit or error (no retry loop beyond the fetcher's own backoff).
      - name: Fetch Yahoo prices (no secrets)
        id: fetch
        if: steps.plan.outputs.fetch == 'true'
        run: |
          pip install -r scripts/ingest/requirements.txt
          python scripts/backfill/fetch_prices.py --plan plan.json --output prices.json
      - name: Write the month file and move the cursor
        if: steps.plan.outputs.fetch == 'true'
        run: node scripts/backfill/prices.mjs commit --prices prices.json
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN_PROD }}
          DATA_REPO: ${{ github.repository }}-data
          COMMIT_SHA: ${{ steps.approved.outputs.sha }}
