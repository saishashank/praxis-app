# Deploy production (OPS-041, SEC-108 c). Runs only for commits on `release` (the
# `deploy-production` environment allows `release` only) and WAITS for the Owner's approval in
# GitHub ("Review deployments"). This job's approved deployment record is what every production
# workflow and the nightly watchdog trust (SEC-108 c, d; D-051). The bootstrap release's run is
# the first approval (BLD-011). Vercel builds remotely, so no environment value is pulled onto the
# runner. Targets are hard-coded: Vercel project `praxis-app`, Worker `praxis-sentinel`.
# Secrets are referenced ONLY in `env:` blocks, never inside `run:` scripts.
name: Deploy production

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: deploy-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy production Worker (praxis-sentinel)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PROD }}
        run: >-
          npx wrangler deploy --name praxis-sentinel
          --var "BUILD_COMMIT:${GITHUB_SHA}"

      # APP_COMMIT is what the nightly watchdog compares with this approved deployment (D-051).
      - name: Deploy production Vercel project (praxis-app)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PROD }}
        run: |
          npx --yes vercel@63.1.0 deploy --prod --yes \
            --project praxis-app --token "$VERCEL_TOKEN" \
            --build-env "APP_COMMIT=${GITHUB_SHA}" --env "APP_COMMIT=${GITHUB_SHA}" \
            > /dev/null
          echo "Production deployed at commit ${GITHUB_SHA}."
