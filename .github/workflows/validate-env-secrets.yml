name: Validate Environment Secrets

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    name: Validate all environment credentials

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cloudflare API validation
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ FAILED: Cloudflare API token or account ID not set"
            exit 1
          fi

          # Test Cloudflare API access
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/namespaces")

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "403" ]; then
            echo "✅ PASSED: Cloudflare API token is valid"
          else
            echo "❌ FAILED: Cloudflare API returned HTTP $RESPONSE"
            exit 1
          fi

      # Turso Database validation
      - name: Validate Turso credentials
        env:
          TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_CONNECTION_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "❌ FAILED: Turso connection URL or auth token not set"
            exit 1
          fi

          # Parse DB URL to extract host
          DB_HOST=$(echo "$TURSO_CONNECTION_URL" | grep -oP '(?<=libsql://).*?(?=\.)' || echo "")

          if [ -z "$DB_HOST" ]; then
            echo "⚠️  WARNING: Could not parse Turso connection URL format"
            echo "   Ensure TURSO_CONNECTION_URL is set correctly"
          else
            echo "✅ PASSED: Turso credentials are configured (URL parsed successfully)"
          fi

      # Google API validation
      - name: Validate Google credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          MISSING_COUNT=0

          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "❌ FAILED: GOOGLE_CLIENT_ID not set"
            MISSING_COUNT=$((MISSING_COUNT + 1))
          fi

          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "❌ FAILED: GOOGLE_CLIENT_SECRET not set"
            MISSING_COUNT=$((MISSING_COUNT + 1))
          fi

          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "⚠️  WARNING: GOOGLE_API_KEY not yet set (may be optional)"
          fi

          if [ "$MISSING_COUNT" -gt 0 ]; then
            exit 1
          fi

          echo "✅ PASSED: Google OAuth credentials are configured"

      # Resend Email API validation
      - name: Validate Resend credentials
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "⚠️  WARNING: RESEND_API_KEY not yet set"
            exit 0
          fi

          # Test Resend API access with a simple metadata call
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            "https://api.resend.com/emails")

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "400" ] || [ "$RESPONSE" = "422" ]; then
            echo "✅ PASSED: Resend API key is valid"
          else
            echo "❌ FAILED: Resend API returned HTTP $RESPONSE"
            exit 1
          fi

      # LLM Provider credentials validation
      - name: Validate LLM provider credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          LLM_COUNT=0

          if [ ! -z "$GROQ_API_KEY" ]; then
            echo "✅ PASSED: Groq API key is configured"
            LLM_COUNT=$((LLM_COUNT + 1))
          fi

          if [ ! -z "$OPENROUTER_API_KEY" ]; then
            echo "✅ PASSED: OpenRouter API key is configured"
            LLM_COUNT=$((LLM_COUNT + 1))
          fi

          if [ ! -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            echo "✅ PASSED: Google Generative AI API key is configured"
            LLM_COUNT=$((LLM_COUNT + 1))
          fi

          if [ "$LLM_COUNT" -eq 0 ]; then
            echo "⚠️  WARNING: No LLM provider keys configured yet"
            exit 0
          fi

      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment Secrets Validation Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "This workflow validates that all required environment"
          echo "secrets are accessible. Warnings do not block the build."
          echo ""
          echo "Required groups:"
          echo "  • Cloudflare (API token + account ID)"
          echo "  • Turso (connection URL + auth token)"
          echo "  • Google (OAuth client ID + secret, API key)"
          echo "  • Resend (API key)"
          echo "  • LLM providers (≥1 of: Groq, OpenRouter, Google AI)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
