name: CI

on:
  push:
  pull_request:
    branches: [main, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Theme contrast (UXN-280, WCAG 2.2 AA / AAA)
        run: node scripts/ci/contrast-check.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke
      - run: npm run test:routes
      - run: npm run test:hygiene
      - name: Licence allow-list (UXN-019)
        run: npm run test:licences
      - name: Backup restore drill (TST-108, synthetic data, throwaway key)
        run: node scripts/backup/drill.mjs
      - run: npm run build
      - name: Client bundle secret scan (AT-03)
        run: node scripts/ci/bundle-secret-scan.mjs
      - name: Bundle budgets (M7 design 4.4, gzip)
        run: npm run test:bundle

  e2e:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E + accessibility (TST-126; local production build, throwaway databases)
        run: npx playwright test
      - name: Readability grade 8 (UXN-030; populated seed)
        run: npx playwright test e2e/readability.spec.ts --project=desktop
        env:
          E2E_SCENARIO: populated
      - name: Lighthouse mobile on Home (AT-26; populated seed)
        run: npm run test:lighthouse
      - name: Upload Playwright report (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan full git history
        run: |
          # On a finding, print only where it is (commit, file, line, rule) so it can be reviewed and,
          # if it is a test fixture, listed in .gitleaksignore. --redact keeps every value out of the
          # report; the report file is never uploaded.
          if ! "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --exit-code 1 --no-banner --log-opts="--all" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" .; then
            node -e 'for (const f of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))) console.log(`${f.Fingerprint}  (rule ${f.RuleID})`)' "$RUNNER_TEMP/gitleaks-report.json"
            exit 1
          fi

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: npx wrangler deploy --dry-run --outdir dist --env staging

  # TST-105 / SEC-110 / SEC-108 (a): fixture-backed tests with the private recordings. The token
  # (FIXTURES_READ_TOKEN, read-only, in the ci-fixtures environment) is never given to fork PRs.
  fixtures:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ci-fixtures
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: this job holds an environment and a token, and a job like that never uses a cache
      # (workflow-lint rule secret-job-storage, SEC-110).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # An empty or missing fixtures repo must not fail the job: the tests then skip (see below).
      - name: Check out the private fixtures repo
        id: fixtures_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}-fixtures
          token: ${{ secrets.FIXTURES_READ_TOKEN }}
          path: fixtures
          persist-credentials: false
      - name: Note when fixtures are unavailable
        if: steps.fixtures_checkout.outcome != 'success'
        run: echo "::warning::fixtures repo not checked out (empty repo or token problem); fixture-backed tests will be skipped"
      - name: Fixture-backed tests (skipped when PRAXIS_FIXTURES_DIR has no content)
        env:
          PRAXIS_FIXTURES_DIR: ${{ github.workspace }}/fixtures
        run: npx vitest run tests/sources/realFixtures.test.ts --reporter=verbose

  # PLT-072: the Yahoo fetcher is Python; its tests mock yfinance and never touch the network.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ingest/requirements-dev.txt
      - name: Install the pinned, hashed test set (SEC-107)
        run: pip install --require-hashes -r scripts/ingest/requirements-dev.txt
      - run: python -m pytest scripts/ingest scripts/backfill scripts/agents -q

  # M8 T17 (decision 38, AT-29, SEC-107): dependency audit. No secret, no artifact. `npm audit`
  # reads the lockfiles over the network (no install needed); scripts/ci/audit-summary.mjs turns
  # each report into the job summary and decides: a production high/critical FAILS (never
  # excepted); a development-tree high/critical fails unless scripts/ci/audit-exceptions.json
  # names it with a reason and an expiry of at most 30 days. pip-audit has no severity, so any
  # known vulnerability in the hashed Python sets fails. The tool itself is installed from the
  # hashed scripts/ingest/requirements-audit.txt.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm audit, app (production tree and whole tree)
        run: |
          set -uo pipefail
          npm audit --omit=dev --json > "$RUNNER_TEMP/root-prod.json" || true
          npm audit --json > "$RUNNER_TEMP/root-all.json" || true
          # An unreachable registry gives an error report with no audit data: that must not pass.
          for f in "$RUNNER_TEMP/root-prod.json" "$RUNNER_TEMP/root-all.json"; do grep -q '"auditReportVersion"' "$f" || { echo "::error::npm audit gave no report"; exit 1; }; done
          node scripts/ci/audit-summary.mjs --label root --prod "$RUNNER_TEMP/root-prod.json" --all "$RUNNER_TEMP/root-all.json"
      - name: npm audit, Worker (production tree and whole tree)
        run: |
          set -uo pipefail
          npm --prefix worker audit --omit=dev --json > "$RUNNER_TEMP/worker-prod.json" || true
          npm --prefix worker audit --json > "$RUNNER_TEMP/worker-all.json" || true
          for f in "$RUNNER_TEMP/worker-prod.json" "$RUNNER_TEMP/worker-all.json"; do grep -q '"auditReportVersion"' "$f" || { echo "::error::npm audit gave no report"; exit 1; }; done
          node scripts/ci/audit-summary.mjs --label worker --prod "$RUNNER_TEMP/worker-prod.json" --all "$RUNNER_TEMP/worker-all.json"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit (pinned, hashed)
        run: pip install --require-hashes -r scripts/ingest/requirements-audit.txt
      - name: pip-audit (fetcher and test sets, and the audit tool's own set)
        run: pip-audit --require-hashes --disable-pip --no-deps --progress-spinner off -r scripts/ingest/requirements-dev.txt -r scripts/ingest/requirements-audit.txt

  # M8 T17 (decisions 12, 13, 20; TST-120, TST-121, TST-131, TST-133). No secret, no artifact.
  # Coverage floors come from vitest.config.mts and worker/vitest.config.mts (80 % overall, 90 % on
  # the named groups); the Worker run uses the root vitest and coverage packages, so it needs no
  # install in worker/. Diff coverage joins the changed lines with both lcov reports: the base is
  # the PR base, or the commit before a push (the long-lived build branch is measured per push),
  # else the merge base with main. Full history (fetch-depth 0) is needed for that.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Two timing tests (replay budget, Worker CPU) allow extra time under v8 instrumentation.
      PRAXIS_COVERAGE_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Coverage floors, app (TST-121)
        run: npm run test:coverage
      - name: Coverage floors, Worker scheduling files (TST-121)
        run: npm run test:coverage:worker
      - name: Diff coverage (TST-120; changed lines 90 %, branches 80 %)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main HEAD)"
          fi
          cat coverage/lcov.info worker/coverage/lcov.info > coverage/lcov.merged.info
          npm run test:diffcov -- --lcov coverage/lcov.merged.info --base "$base"
      - name: Test map (TST-133; the summary lists the covered IDs)
        run: npm run test:map
      - name: Flaky-test quarantine record (TST-131)
        run: npm run test:quarantine

  # M8 T17 (decisions 40, 41; SEC-107, BLD-040). No secret, no artifact. The workflow lint reads
  # every workflow as data; known findings sit in scripts/ci/workflow-lint-exceptions.json, where a
  # "pending" entry only warns here and fails the release gate below.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Workflow lint (decision 40)
        run: npm run lint:workflows
      - name: Environment names match .env.example (decision 41)
        run: npm run test:env-names
      - name: Configuration reference is current (BLD-040)
        run: npm run test:config-reference

  # M8 T17 (decision 25; TST-112): the release gate, only on a pull request into `release`. The
  # Owner adds `release-gate` as a required status check. It runs even when a job it needs failed
  # (a skipped required check would count as passed), reads those results through the Actions API
  # with the job token (actions: read, contents: read; no secret), and also re-runs the licence
  # check and the workflow lint in release mode, which fail while any Owner approval is pending.
  # The first M8 release is data-only and uses the INFRASTRUCTURE gate (decision 25); every later
  # release switches the --mode below to `full`.
  release-gate:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'release' }}
    needs: [app, e2e, secrets, worker, fixtures, python, audit, coverage, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Release gate (infrastructure mode, first M8 release)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/release-gate.mjs --mode infrastructure --sha "$HEAD_SHA" --ci-jobs app,e2e,secrets,worker,fixtures,python,audit,coverage,checks
      - name: Licences, release mode (fails while an Owner approval is pending)
        run: node scripts/ci/licence-check.mjs --release
      - name: Workflow lint, release mode (fails while an Owner approval is pending)
        run: node scripts/ci/workflow-lint.mjs --release
