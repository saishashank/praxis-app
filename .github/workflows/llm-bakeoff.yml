# LLM bake-off (M6 T15, LLM-040…042, TST-111, KB-032; D-112 draft). NOT RUN in M6 (D-110 #7): the first
# run waits for the Owner's approval of the golden set. workflow_dispatch ONLY: no `schedule:`, no
# Worker slot (PLT-015). Role assignment stays a configuration change by the Owner after a passing report.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release head.
# `deployment: false` gives the job the environment's secrets without creating a deployment record.
# The free-tier LLM keys and the database secrets are referenced ONLY in `env:` of the one bake-off
# step. The golden set is read from the checked-out repository (the synthetic ZZ set; a real set is an
# Owner item). Free models only (OpenRouter ids must end in ":free", LLM-003). SEC-110: nothing is
# uploaded as an artifact or cached; the log carries the markdown report (metrics only, no prompts,
# no model text, no keys). `store` writes the rows to `bakeoff_result`; the Owner commits the report.
name: LLM bake-off

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Space separated KIND:MODEL (google, groq, openrouter with a :free model)"
        type: string
        required: true
      trains:
        description: "Space separated KIND=no for providers that do not train on prompts (others are facts-only)"
        type: string
        required: false
        default: ""
      checked:
        description: "Space separated KIND=YYYY-MM-DD, the date each trains_on_prompts value was checked"
        type: string
        required: false
        default: ""
      store:
        description: Write the rows to bakeoff_result
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      deployments: read
    # One run at a time, never cancelling one in progress.
    concurrency:
      group: llm-bakeoff
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: run the commit of the latest APPROVED deploy-production deployment, not the
      # release head. These two steps run only the tiny reviewed script, with github.token
      # alone (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with secrets.
      - name: Bake-off
        run: node scripts/llm/bakeoff.mjs --candidate "$CANDIDATES" --trains "$TRAINS" --checked "$CHECKED"
        env:
          CANDIDATES: ${{ inputs.candidates }}
          TRAINS: ${{ inputs.trains }}
          CHECKED: ${{ inputs.checked }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TURSO_MAIN_URL: ${{ inputs.store && secrets.TURSO_MAIN_URL_PROD || '' }}
          TURSO_MAIN_TOKEN: ${{ inputs.store && secrets.TURSO_MAIN_TOKEN_PROD || '' }}
