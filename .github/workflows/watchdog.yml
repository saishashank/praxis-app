# YAML watchdog (M5 T12, docs/M5_design.md 4.8; D-096 decisions 11, 12, 42; PLT-014a, PLT-019,
# PLT-074, NFR-006; D-062 pattern).
# workflow_dispatch ONLY: the Worker's disabled slots `watchdog-2040` and `watchdog-2150`
# dispatch it with `ref: release` and the input `slot` once the Owner enables them. It has no
# `schedule:` trigger (PLT-015). The dual-UTC trigger lines for 20:40 and 21:50 Melbourne (AEDT and
# AEST) are generated by `node scripts/time/genWatchdogCron.mjs` and are NOT enabled here; adding
# them is a separate Owner-approved change (decision 11).
# What it does (scripts/watchdog/run.mjs): calls the signed evening-review route; if that is not
# ok sends the minimal review directly through Resend with the same email key (one email per review
# date); checks the Worker and the review; on a problem sends an incident email and FAILS ON
# PURPOSE so GitHub's own failure email reaches the Owner even if Resend is down; database
# unreachable -> one database-down email and a failed run. `deliberate_failure` is the Owner test of
# that failure email.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release
# head. `deployment: false` gives the job the environment's secrets without a deployment record.
# SEC-110: nothing is uploaded as an artifact or cached. Secrets appear ONLY in `env:` of the last
# step and never inside a `run:` script.
name: Watchdog

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which watchdog slot this run stands for (Melbourne time)"
        type: choice
        options:
          - manual
          - "2040"
          - "2150"
        default: manual
      deliberate_failure:
        description: "Owner test: fail on purpose so GitHub's failure email is sent"
        type: boolean
        default: false

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. The review itself is de-duplicated
    # by its email key (`review:<date>`), not by this group.
    concurrency:
      group: watchdog
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone
      # (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with secrets: database (read, plus the email records the send core writes),
      # Resend and the owner address (direct minimal review, incident and database-down emails), and
      # the app URL and HMAC secret (signed route call).
      - name: Watchdog
        run: node scripts/watchdog/run.mjs
        env:
          WATCHDOG_SLOT: ${{ inputs.slot }}
          WATCHDOG_DELIBERATE_FAILURE: ${{ inputs.deliberate_failure && '1' || '0' }}
          PRAXIS_ENV: production
          EMAIL_PROVIDER: resend
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_PROD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL_PROD }}
          PII_HASH_KEY: ${{ secrets.PII_HASH_KEY_PROD }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL_PROD }}
          ACTIONS_HMAC_SECRET: ${{ secrets.ACTIONS_HMAC_SECRET_PROD }}
