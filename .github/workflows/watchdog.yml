# YAML watchdog (M5 T12, docs/M5_design.md 4.8; D-096 decisions 11, 12, 42; PLT-014a, PLT-019,
# PLT-074, NFR-006; D-062 pattern).
# workflow_dispatch ONLY: the Worker's listed-only slots `watchdog-2040` and `watchdog-2150`
# (M8, D-160) dispatch it with `ref: release` and the input `slot` once the Owner lists them in
# the System Health "Worker slots" block. It has no
# `schedule:` trigger (PLT-015). The dual-UTC trigger lines for 20:40 and 21:50 Melbourne (AEDT and
# AEST) are generated by `node scripts/time/genWatchdogCron.mjs` and are NOT enabled here; adding
# them is a separate Owner-approved change (decision 11).
# What it does (scripts/watchdog/run.mjs): calls the signed evening-review route; if that is not
# ok sends the minimal review directly through Resend with the same email key (one email per review
# date); checks the Worker and the review; on a problem sends an incident email and FAILS ON
# PURPOSE so GitHub's own failure email reaches the Owner even if Resend is down; database
# unreachable -> one database-down email and a failed run. `deliberate_failure` is the Owner test of
# that failure email.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release
# head. `deployment: false` gives the job the environment's secrets without a deployment record.
# SEC-110: nothing is uploaded as an artifact or cached. Secrets appear ONLY in `env:` of the last
# step and never inside a `run:` script.
name: Watchdog

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which watchdog slot this run stands for (Melbourne time)"
        type: choice
        options:
          - manual
          - "2040"
          - "2150"
        default: manual
      deliberate_failure:
        description: "Owner test: fail on purpose so GitHub's failure email is sent"
        type: boolean
        default: false

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. The review itself is de-duplicated
    # by its email key (`review:<date>`), not by this group.
    concurrency:
      group: watchdog
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone
      # (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with secrets: database (read, plus the email records the send core writes),
      # Resend and the owner address (direct minimal review, incident and database-down emails), and
      # the app URL and HMAC secret (signed route call).
      - name: Watchdog
        run: node scripts/watchdog/run.mjs
        env:
          WATCHDOG_SLOT: ${{ inputs.slot }}
          WATCHDOG_DELIBERATE_FAILURE: ${{ inputs.deliberate_failure && '1' || '0' }}
          PRAXIS_ENV: production
          EMAIL_PROVIDER: resend
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_PROD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL_PROD }}
          PII_HASH_KEY: ${{ secrets.PII_HASH_KEY_PROD }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL_PROD }}
          ACTIONS_HMAC_SECRET: ${{ secrets.ACTIONS_HMAC_SECRET_PROD }}
      # M8 T9 (SEC-017 l, OPS-040, PLT-022b): the temporary restore secrets exist only during a
      # restore or drill. This step runs even if the watchdog step failed and FAILS (so GitHub's
      # failure email is the alert) while either is still present. It only tests for emptiness: the
      # values are never printed.
      - name: Fail while a temporary restore secret is present
        if: ${{ always() }}
        run: |
          present=0
          if [ -n "$BACKUP_PRIVATE_KEY" ]; then
            echo "::error::temporary restore secret still present (BACKUP_PRIVATE_KEY)"
            present=1
          fi
          if [ -n "$TURSO_PLATFORM_TOKEN_TEMP" ]; then
            echo "::error::temporary restore secret still present (TURSO_PLATFORM_TOKEN_TEMP)"
            present=1
          fi
          if [ "$present" -ne 0 ]; then
            echo "temporary restore secret still present" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No temporary restore secret is present."
        env:
          BACKUP_PRIVATE_KEY: ${{ secrets.BACKUP_PRIVATE_KEY }}
          TURSO_PLATFORM_TOKEN_TEMP: ${{ secrets.TURSO_PLATFORM_TOKEN_TEMP }}

  # M8 T9 (decision 30; PLT-073 20:40 step): the staging job. The staging Worker dispatches
  # `ref: main`. Same step as production on the dispatched `main` commit with the staging database,
  # the staging Resend key and owner address (email goes only to the Owner), the staging app URL and
  # the staging HMAC secret. The temporary-restore-secret check is production-only (those secrets do
  # not exist in staging).
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: watchdog-staging
      cancel-in-progress: false
    environment:
      name: staging
      deployment: false
    env:
      PRAXIS_ENV: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with secrets.
      - name: Watchdog
        run: node scripts/watchdog/run.mjs
        env:
          WATCHDOG_SLOT: ${{ inputs.slot }}
          WATCHDOG_DELIBERATE_FAILURE: ${{ inputs.deliberate_failure && '1' || '0' }}
          PRAXIS_ENV: staging
          EMAIL_PROVIDER: resend
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_STAGING }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_STAGING }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_STAGING }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL_STAGING }}
          PII_HASH_KEY: ${{ secrets.PII_HASH_KEY_STAGING }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL_STAGING }}
          ACTIONS_HMAC_SECRET: ${{ secrets.ACTIONS_HMAC_SECRET_STAGING }}
