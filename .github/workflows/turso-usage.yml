# Daily Turso usage sample (OPS-104, PLT-080; D-958, D-963). The Worker's clock dispatches this file
# once a day (slot `turso-usage`, 06:40 Melbourne) with `ref: release`. workflow_dispatch ONLY, no
# `schedule:` (PLT-015). It asks the Turso platform API how much of the free plan this month has used
# and writes one `usage_sample` row, which the Usage page and System Health read (the app never holds a
# platform token).
# The platform token TURSO_PLATFORM_TOKEN_USAGE is a GitHub production-environment secret referenced in
# the `env:` of ONE step (the sample step, which has no database access); the store step holds the
# database secrets and no platform token. While the token is absent the sample step records
# source = 'unavailable' and the job still succeeds, so the build needs no Owner action.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release head.
# `deployment: false` gives the job the environment's secrets without creating a deployment record, so
# a metering run never counts as an approved deploy (D-023). SEC-110: nothing is uploaded or cached and
# the logs carry the source, the plan id and three counts only.
name: Turso usage sample

on: workflow_dispatch

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress.
    concurrency:
      group: turso-usage
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step that sees the platform token. No database access here.
      - name: Sample the Turso usage (platform token, no database)
        run: node scripts/usage/turso-sample.mjs sample --out "$RUNNER_TEMP/usage-sample.json"
        env:
          TURSO_PLATFORM_TOKEN_USAGE: ${{ secrets.TURSO_PLATFORM_TOKEN_USAGE }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
      # The only step that sees the database secrets. No platform token here.
      - name: Store the sample
        run: node scripts/usage/turso-sample.mjs store --file "$RUNNER_TEMP/usage-sample.json"
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
