# Yearly trading-calendar draft (OPS-103, DAT-160; D-961). The Worker's clock dispatches this file once a
# year (slot `calendar-draft`, 1 November 09:00 Melbourne) with `ref: release`. workflow_dispatch ONLY, no
# `schedule:` (PLT-015). It generates next year's trading days from each market's computed holiday rules
# and stores them as PROVISIONAL rows (confirmed = 0) when that year has no rows yet; the Owner checks them
# against the exchange's published calendar and confirms the year on System Health. No network access
# beyond the database; the holiday rules are computed, not fetched.
# Secrets are referenced ONLY in the `env:` of the one step that writes (SEC-110). The optional inputs
# (market code, year) go through `env:` too, never into the script text.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release head.
# `deployment: false` gives the job the environment's secrets without creating a deployment record, so a
# draft run never counts as an approved deploy (D-023). Logs carry the market, the year and a row count.
name: Calendar draft

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market code to draft (empty = every market that has calendar rules)
        type: string
        required: false
        default: ""
      year:
        description: Year to draft (empty = next year, Melbourne time)
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. The draft inserts only into a year
    # that has no rows, so a repeat finds them and writes nothing.
    concurrency:
      group: calendar-draft
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Draft the calendar
        run: node scripts/calendar/draft.mjs --market "$MARKET_INPUT" --year "$YEAR_INPUT"
        env:
          MARKET_INPUT: ${{ inputs.market }}
          YEAR_INPUT: ${{ inputs.year }}
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
