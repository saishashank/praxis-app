# Batch 2b "signals and orders" for the AU arena, M4 T8 (docs/M4_design.md 4.1, 4.4; ARN-060,
# ARN-020; D-062 pattern; D-077; D-087).
# workflow_dispatch ONLY: the Worker's per-minute cron (the master clock, PLT-071) dispatches this
# workflow with `ref: release` after the decision cut-off (18:10) once batch 2a has closed the books
# (its slot is DISABLED until the Owner enables the arena). It has no `schedule:` trigger (PLT-015).
# The database secrets are referenced ONLY in `env:` of the one step that reads and writes the
# arena and agent tables.
# SEC-108 c: the production job checks out the latest approved deploy-production commit, not the
# release head. `deployment: false` gives the job the environment's secrets without creating a
# deployment record, so a data run never counts as an approved deploy (D-023, SEC-108 c).
# SEC-110: nothing is uploaded as an artifact or cached. Logs carry statuses and counts only.
# What it does: A4 indicators, A3 regime, A2 events, the A5 family rules, then per live cohort the
# CS exits, IS stop levels, entry orders (FAM-001 sizing, re-entry block, quality gate) and the
# matched random-entry controls (src/lib/agents/batch2b.ts), one run_record per session keyed
# `arena-2b:AU:<date>`. It decides ONE session (no catch-up: an order for a past session would be
# filled after the fact). With market.mode other than `full` (production is data_only until the
# Owner approves the arena, D-066) the script writes a skipped run record and touches NO table.
# NOT built here: batch 3 (deterministic review numbers) is a later M4 task.
name: Arena signals and orders (batch 2b)

on: workflow_dispatch

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. The "already succeeded" check is
    # made by the script (run record `arena-2b:AU:<Sydney date>`).
    concurrency:
      group: arena-signals
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: run the commit of the latest APPROVED deploy-production deployment, not the
      # release head. These two steps run only the tiny reviewed script, with github.token
      # alone (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with database secrets. It waits (up to 20 minutes) for batch 2a of the same
      # session, then decides it.
      - name: Decide the session
        run: node scripts/arena/signals.mjs
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
          COMMIT_SHA: ${{ steps.approved.outputs.sha }}
