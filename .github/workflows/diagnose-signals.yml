# Read-only diagnosis of batch 2b (live defect: production records signals=0 every night). It runs
# the same day inputs and family rules as arena-signals.yml for the given sessions, once with the
# live parameters and once with the defaults, and prints counts only. Its database client refuses
# every statement but a plain SELECT (src/lib/arena/diagnose.ts), so it writes no row.
# workflow_dispatch ONLY, no `schedule:` (PLT-015). The database secrets are referenced ONLY in
# `env:` of the one step that reads the database.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release
# head. `deployment: false` gives the job the environment's secrets without creating a deployment
# record, so a data run never counts as an approved deploy (D-023).
# SEC-110: nothing is uploaded as an artifact or cached. Logs carry statuses and counts only.
name: Diagnose signals (AU, read-only)

on:
  workflow_dispatch:
    inputs:
      dates:
        description: Sessions to diagnose, comma separated (YYYY-MM-DD)
        required: true
        default: "2026-10-28,2026-10-29,2026-10-30"

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    concurrency:
      group: diagnose-signals
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with database secrets; it reads only.
      - name: Diagnose the sessions (read-only)
        run: node scripts/arena/diagnose.mjs --dates "$DATES"
        env:
          DATES: ${{ inputs.dates }}
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}

  # The staging Worker dispatches `ref: main`, so this file needs a job that is selected there.
  # Nothing runs on staging for this workflow: it diagnoses the live database only. The job
  # references no secret and checks out nothing; it only prints a notice.
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: diagnose-signals-staging
      cancel-in-progress: false
    environment:
      name: staging
      deployment: false
    env:
      PRAXIS_ENV: staging
    steps:
      - name: Nothing to run on staging
        run: echo "diagnose-signals has no staging variant (live database only); nothing was run."
