# Index-history backfill (D-175): the ASX 200 (^AXJO) daily bars since the history floor, written to
# index_bar so the replay and the regime gate know the market mood on past dates. Without them every
# family is blocked on "unknown" and a full replay records no signal. A one-off (re-runs write 0).
# workflow_dispatch ONLY, no `schedule:` (PLT-015). Same security pattern as backfill-prices.yml:
# secrets are referenced ONLY in `env:` of the step that writes the database; the Yahoo fetch step
# has NO secrets and no database access.
# SEC-108 c: the job checks out the latest approved deploy-production commit, not the release
# head. `deployment: false` gives the job the environment's secrets without creating a deployment
# record, so a data run never counts as an approved deploy (D-023).
# SEC-110: request.json, bars.json and index.json stay on the runner; nothing is uploaded or
# cached. Logs carry counts and statuses only.
name: Backfill index (AU)

on:
  workflow_dispatch:
    inputs:
      from:
        description: First date (YYYY-MM-DD); the default leaves five years of regime warm-up before 2019
        required: false
        default: "2014-01-01"

permissions: {}

jobs:
  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. Inserts are first-seen only.
    concurrency:
      group: backfill-index
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Write the fetch request (no secrets)
        run: node scripts/backfill/index.mjs request --from "$FROM" --out request.json
        env:
          FROM: ${{ inputs.from }}
      # No secrets here: this step only talks to Yahoo and writes the files on the runner.
      - name: Fetch Yahoo index bars (no secrets)
        run: |
          pip install --require-hashes -r scripts/ingest/requirements.txt
          python scripts/ingest/yahoo_fetch.py --request request.json --output bars.json --index-output index.json
      - name: Write the index bars (first-seen only)
        run: node scripts/backfill/index.mjs commit --index index.json --from "$FROM"
        env:
          FROM: ${{ inputs.from }}
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}

  # The staging Worker dispatches `ref: main`, so this file needs a job that is selected there.
  # Nothing runs on staging for this workflow: it fetches from Yahoo, which staging must never reach
  # (NFR-040). The job references no secret and checks out nothing; it only prints a notice.
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: backfill-index-staging
      cancel-in-progress: false
    environment:
      name: staging
      deployment: false
    env:
      PRAXIS_ENV: staging
    steps:
      - name: Nothing to run on staging
        run: echo "backfill-index has no staging variant (NFR-040, SEC-017); nothing was run."
