  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. Inserts are first-seen only.
    concurrency:
      group: asx-fetch
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: these two steps run only the tiny reviewed script, with github.token alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECT_COMMIT: ${{ inputs.commit }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # No secrets here: this step only talks to the ASX and writes the files on the runner.
      - name: Fetch from the ASX (no secrets)
        run: node scripts/asx/fetch.mjs --out-dir asx $HISTORY_FLAG
        env:
          HISTORY_FLAG: ${{ inputs.history && '--history' || '' }}
          ASX_USER_AGENT: ${{ vars.ASX_USER_AGENT }}
      - name: Store announcements and the company list
        run: node scripts/asx/ingest.mjs --dir asx
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
