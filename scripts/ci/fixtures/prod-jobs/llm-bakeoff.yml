  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      deployments: read
    # One run at a time, never cancelling one in progress.
    concurrency:
      group: llm-bakeoff
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: run the commit of the latest APPROVED deploy-production deployment, not the
      # release head. These two steps run only the tiny reviewed script, with github.token
      # alone (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with secrets.
      - name: Bake-off
        run: node scripts/llm/bakeoff.mjs --candidate "$CANDIDATES" --trains "$TRAINS" --checked "$CHECKED"
        env:
          CANDIDATES: ${{ inputs.candidates }}
          TRAINS: ${{ inputs.trains }}
          CHECKED: ${{ inputs.checked }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TURSO_MAIN_URL: ${{ inputs.store && secrets.TURSO_MAIN_URL_PROD || '' }}
          TURSO_MAIN_TOKEN: ${{ inputs.store && secrets.TURSO_MAIN_TOKEN_PROD || '' }}
