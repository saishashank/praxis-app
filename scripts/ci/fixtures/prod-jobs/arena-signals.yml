  production:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read
    # PLT-076: one run at a time, never cancelling one in progress. The "already succeeded" check is
    # made by the script (run record `arena-2b:AU:<Sydney date>`).
    concurrency:
      group: arena-signals
      cancel-in-progress: false
    environment:
      name: production
      deployment: false
    steps:
      # SEC-108 c: run the commit of the latest APPROVED deploy-production deployment, not the
      # release head. These two steps run only the tiny reviewed script, with github.token
      # alone (contents/deployments: read), never an environment secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Find approved commit
        id: approved
        run: node ci-tools/scripts/ci/approved-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The only step with database secrets. It waits (up to 20 minutes) for batch 2a of the same
      # session, then decides it.
      - name: Decide the session
        run: node scripts/arena/signals.mjs
        env:
          TURSO_MAIN_URL: ${{ secrets.TURSO_MAIN_URL_PROD }}
          TURSO_MAIN_TOKEN: ${{ secrets.TURSO_MAIN_TOKEN_PROD }}
          COMMIT_SHA: ${{ steps.approved.outputs.sha }}
          # M8 T9 / D-154: the Resend variables, so the batch 3 ledger-invariant S1 incident is
          # emailed to the Owner (without them it is only recorded). Same names as the watchdog.
          PRAXIS_ENV: production
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_PROD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL_PROD }}
          PII_HASH_KEY: ${{ secrets.PII_HASH_KEY_PROD }}
