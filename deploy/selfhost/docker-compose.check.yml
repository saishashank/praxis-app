# Pre-deploy check pair (INFRA §10): web + sqld on a throwaway copy of last night's backup. Project
# "praxis-check". No public port, no clock, no email. Used by `praxis deploy <sha>` (T7, scripts/selfhost/predeploy.mjs),
# which starts it, restores the data, migrates, smoke-tests and scans it, then wipes it (`down -v`: the named volume
# check_data is the throwaway database). Variables, set by predeploy.mjs (never `latest`):
#   PRAXIS_WEB_IMAGE   the web image to test, by digest (ghcr.io/<owner>/praxis-web@sha256:...) or tag
#   PRAXIS_SHA         fallback when PRAXIS_WEB_IMAGE is unset: the tag of ghcr.io/saishashank/praxis-web
#   PRAXIS_ENV_DIR     where web.env and sqld.env live (default /srv/praxis/env; branch CI points it at a temp dir)
# The smoke test, the ZAP scan and the migration containers attach to the network "praxis-check".
name: praxis-check

x-hardening: &hardening
  restart: "no"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512

services:
  web:
    <<: *hardening
    image: ${PRAXIS_WEB_IMAGE:-ghcr.io/saishashank/praxis-web:${PRAXIS_SHA:?set PRAXIS_WEB_IMAGE or PRAXIS_SHA}}
    # The check pair together is budgeted at 2 GB (INFRA §9): web 1 GB + sqld 1 GB.
    mem_limit: 1g
    memswap_limit: 1g
    env_file: ${PRAXIS_ENV_DIR:-/srv/praxis/env}/web.env
    environment:
      # Overrides win over env_file: nothing in the check can send mail or start work.
      PRAXIS_RUNTIME: selfhost
      CLOCK_ENABLED: "0"
      EMAIL_LIVE: "0"
      EMAIL_PROVIDER: mock
      APP_BASE_URL: http://web:3000
      AUTH_URL: http://web:3000
      AUTH_TRUST_HOST: "true"
      NODE_OPTIONS: --max-old-space-size=768
    expose: ["3000"]
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001,size=128m
    networks: [check]
    depends_on:
      sqld:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  sqld:
    <<: *hardening
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32 # keep equal to docker-compose.prod.yml
    mem_limit: 1g
    memswap_limit: 1g
    env_file: ${PRAXIS_ENV_DIR:-/srv/praxis/env}/sqld.env
    # Same as docker-compose.prod.yml: the image's wrapper entrypoint is replaced (found by real Docker, INFRA T4);
    # the named volume takes its owner (uid 666) from the image's /var/lib/sqld.
    entrypoint: ["/bin/sqld"]
    user: "666:666"
    command:
      - --http-listen-addr=0.0.0.0:8080
      - --admin-listen-addr=0.0.0.0:8081
      - --enable-namespaces
      - --db-path=/var/lib/sqld/data.sqld
    expose: ["8080", "8081"]
    volumes:
      - check_data:/var/lib/sqld
    tmpfs:
      - /tmp
    networks:
      check:
        aliases: [main.sqld, auth.sqld]
    healthcheck:
      # The image is debian-slim without curl or wget (found by real Docker, INFRA T4): a bash TCP probe instead.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\r\n\r\n' >&3; head -n1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

networks:
  check:
    name: praxis-check

volumes:
  # The throwaway database of the check. `docker compose down -v` removes it.
  check_data:
