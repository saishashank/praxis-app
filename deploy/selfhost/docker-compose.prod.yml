# Production stack for the self-hosted runtime (INFRA §3.1, §3.2, §9). Project "praxis-prod".
# Lives on the host at /srv/praxis/compose/. Non-secret variables come from /srv/praxis/compose/.env
# (written by bootstrap.sh / deploy.sh): PRAXIS_SHA, PRAXIS_DOMAIN. Secrets only in /srv/praxis/env/*.env.
#
# PRAXIS_SHA is the git SHA tag. For deploy-by-digest (INFRA §3.2) deploy.sh sets it to
# "<sha>@sha256:<digest>", which compose accepts as tag@digest. `latest` is never used.
name: praxis-prod

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: *hardening
    # Tag plus multi-arch index digest, resolved from the registry on 2026-11-10 (the digest is what runs).
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      PRAXIS_DOMAIN: ${PRAXIS_DOMAIN:?set PRAXIS_DOMAIN in /srv/praxis/compose/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    networks: [praxis]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    <<: *hardening
    image: ${PRAXIS_WEB_IMAGE:-ghcr.io/saishashank/praxis-web:${PRAXIS_SHA:?set PRAXIS_SHA}}
    mem_limit: 1536m
    memswap_limit: 1536m
    env_file: /srv/praxis/env/web.env
    environment:
      PRAXIS_RUNTIME: selfhost
      NODE_OPTIONS: --max-old-space-size=1152
    expose: ["3000"]
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001,size=256m
    networks: [praxis]
    depends_on:
      sqld:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  clock:
    <<: *hardening
    image: ${PRAXIS_JOBS_IMAGE:-ghcr.io/saishashank/praxis-jobs:${PRAXIS_SHA:?set PRAXIS_SHA}}
    mem_limit: 5g
    memswap_limit: 5g
    env_file: /srv/praxis/env/jobs.env
    environment:
      PRAXIS_RUNTIME: selfhost
      # Scratch folders and job logs live on the host volume below (INFRA §3.3); the manifest is baked into the image.
      JOBS_ROOT: /srv/praxis/jobs
      JOBS_MANIFEST: /app/deploy/selfhost/jobs.json
    expose: ["9100"]
    volumes:
      - /srv/praxis/jobs:/srv/praxis/jobs
    tmpfs:
      - /tmp:size=1g
      # Vite bundles the TypeScript engines here at run time (see Dockerfile.jobs).
      - /app/node_modules/.cache:uid=10001,gid=10001,size=512m
    networks: [praxis]
    depends_on:
      web:
        condition: service_healthy
      sqld:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  sqld:
    <<: *hardening
    # Release v0.24.32 pinned by the multi-arch index digest, resolved from the registry on 2026-11-10.
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32@sha256:dedf5273da945d90f3b85fe367ed8f821349117ac2c488bf43c4a6bf9f2123e0
    mem_limit: 1536m
    memswap_limit: 1536m
    env_file: /srv/praxis/env/sqld.env
    # Namespaces "main" and "auth" (INFRA §8.1); the JWT public key arrives as SQLD_AUTH_JWT_KEY from sqld.env.
    # The image's own entrypoint (docker-wrapper.sh) chowns the data dir, drops to uid 666 with gosu and appends its
    # own --db-path / --http-listen-addr / --grpc-listen-addr, which clash with ours and need capabilities we drop
    # (found by real Docker, INFRA T4). So the entrypoint is replaced: sqld runs directly as uid 666 with our flags,
    # on a data dir that uid owns (the image's volume, or /srv/praxis/sqld chowned by bootstrap.sh).
    entrypoint: ["/bin/sqld"]
    user: "666:666"
    command:
      - --http-listen-addr=0.0.0.0:8080
      - --admin-listen-addr=0.0.0.0:8081
      - --enable-namespaces
      - --db-path=/var/lib/sqld/data.sqld
    expose: ["8080", "8081"]
    volumes:
      - /srv/praxis/sqld:/var/lib/sqld
    tmpfs:
      - /tmp
    networks:
      praxis:
        # Namespace routing by Host header: main.sqld / auth.sqld resolve to this container
        # (TODO verify with the pinned image; T4 owns the exact TURSO_*_URL values).
        aliases: [main.sqld, auth.sqld]
    healthcheck:
      # The image is debian-slim without curl or wget (found by real Docker, INFRA T4): a bash TCP probe instead.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\r\n\r\n' >&3; head -n1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  # One bridge network, no published ports except caddy's 80/443. web and clock need outbound access
  # (Google OAuth, Resend, LLM providers, Yahoo/ASX), so the network is not "internal: true".
  praxis:
    name: praxis-prod

volumes:
  caddy_data:
  caddy_config:
