# Production stack for the self-hosted runtime (INFRA §3.1, §3.2, §9). Project "praxis-prod".
# Lives on the host at /srv/praxis/compose/. Non-secret variables come from /srv/praxis/compose/.env
# (written by bootstrap.sh / deploy.sh): PRAXIS_SHA, PRAXIS_DOMAIN. Secrets only in /srv/praxis/env/*.env.
#
# PRAXIS_SHA is the git SHA tag. For deploy-by-digest (INFRA §3.2) deploy.sh sets it to
# "<sha>@sha256:<digest>", which compose accepts as tag@digest. `latest` is never used.
name: praxis-prod

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: *hardening
    # TODO pin digest: replace the tag with caddy:2-alpine@sha256:<digest> at the first real deploy.
    image: caddy:2-alpine
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      PRAXIS_DOMAIN: ${PRAXIS_DOMAIN:?set PRAXIS_DOMAIN in /srv/praxis/compose/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    networks: [praxis]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    <<: *hardening
    image: ghcr.io/saishashank/praxis-web:${PRAXIS_SHA:?set PRAXIS_SHA}
    mem_limit: 1536m
    memswap_limit: 1536m
    env_file: /srv/praxis/env/web.env
    environment:
      PRAXIS_RUNTIME: selfhost
      NODE_OPTIONS: --max-old-space-size=1152
    expose: ["3000"]
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001,size=256m
    networks: [praxis]
    depends_on:
      sqld:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  clock:
    <<: *hardening
    image: ghcr.io/saishashank/praxis-jobs:${PRAXIS_SHA:?set PRAXIS_SHA}
    mem_limit: 5g
    memswap_limit: 5g
    env_file: /srv/praxis/env/jobs.env
    environment:
      PRAXIS_RUNTIME: selfhost
      # Scratch folders and job logs live on the host volume below (INFRA §3.3); the manifest is baked into the image.
      JOBS_ROOT: /srv/praxis/jobs
      JOBS_MANIFEST: /app/deploy/selfhost/jobs.json
    expose: ["9100"]
    volumes:
      - /srv/praxis/jobs:/srv/praxis/jobs
    tmpfs:
      - /tmp:size=1g
      # Vite bundles the TypeScript engines here at run time (see Dockerfile.jobs).
      - /app/node_modules/.cache:uid=10001,gid=10001,size=512m
    networks: [praxis]
    depends_on:
      web:
        condition: service_healthy
      sqld:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  sqld:
    <<: *hardening
    # Pinned tag (current release at authoring time, 2026-11-10).
    # TODO pin digest: add @sha256:<digest> at the first real deploy.
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32
    mem_limit: 1536m
    memswap_limit: 1536m
    env_file: /srv/praxis/env/sqld.env
    # Namespaces "main" and "auth" (INFRA §8.1). The JWT public key arrives as SQLD_AUTH_JWT_KEY from sqld.env.
    # TODO verify against the pinned image (T4): flag names and the data path.
    command:
      - /bin/sqld
      - --http-listen-addr=0.0.0.0:8080
      - --admin-listen-addr=0.0.0.0:8081
      - --enable-namespaces
      - --db-path=/var/lib/sqld/data.sqld
    expose: ["8080", "8081"]
    volumes:
      - /srv/praxis/sqld:/var/lib/sqld
    tmpfs:
      - /tmp
    networks:
      praxis:
        # Namespace routing by Host header: main.sqld / auth.sqld resolve to this container
        # (TODO verify with the pinned image; T4 owns the exact TURSO_*_URL values).
        aliases: [main.sqld, auth.sqld]
    healthcheck:
      # TODO verify: the image must have curl or wget; otherwise switch to a TCP check.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/health || wget -qO- http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  # One bridge network, no published ports except caddy's 80/443. web and clock need outbound access
  # (Google OAuth, Resend, LLM providers, Yahoo/ASX), so the network is not "internal: true".
  praxis:
    name: praxis-prod

volumes:
  caddy_data:
  caddy_config:
