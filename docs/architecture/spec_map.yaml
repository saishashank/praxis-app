edges:
  - { from: "service:worker", to: "service:actions", kind: dispatch, contract: "workflow_dispatch via the GitHub API with the dispatch token (name only); idempotent per slot.", views: [platform, agents] }
  - { from: "service:worker", to: "service:app", kind: http, contract: "Signed POST (HMAC) to the internal routes; a nonce stops replays.", views: [platform, agents, security] }
  - { from: "service:worker", to: "service:turso-main", kind: data, contract: "Worker reads and writes worker_state and sentinel rows.", views: [platform, agents] }
  - { from: "service:actions", to: "service:app", kind: http, contract: "Signed POST to the internal routes from batch jobs.", views: [platform, agents, security] }
  - { from: "service:actions", to: "service:turso-main", kind: data, contract: "Ingest and batch jobs write with the main database token (name only).", views: [platform, data, cortex, agents, learning] }
  - { from: "service:app", to: "service:turso-main", kind: data, contract: "Reads for pages; writes for server actions and internal routes.", views: [platform, data, cortex, agents, llm, email, learning] }
  - { from: "service:app", to: "service:turso-auth", kind: data, contract: "Sessions, roles, preferences, sharing and audit.", views: [platform, security] }
  - { from: "service:actions", to: "service:data-repo", kind: data, contract: "Encrypted backup and archive pushes with a repo-scoped token (name only).", views: [platform, data, security] }
  - { from: "service:app", to: "host:accounts.google.com", kind: http, contract: "OAuth sign-in redirect.", views: [security, platform] }
  - { from: "service:app", to: "host:api.resend.com", kind: email, contract: "One email per key through Resend; failures are recorded.", views: [email, platform] }
  - { from: "service:actions", to: "host:api.resend.com", kind: email, contract: "Watchdog sends directly if the app route fails.", views: [email, platform] }
  - { from: "agent:A1", to: "slot:asx-poll", kind: uses, contract: "The ASX poll slot drives A1.", views: [agents] }
  - { from: "agent:A1", to: "table:main.announcement", kind: data, contract: "Writes new announcements.", views: [data] }
  - { from: "agent:A1", to: "table:main.alert", kind: data, contract: "Writes alerts.", views: [email] }
  - { from: "agent:A1", to: "llm-role:R1", kind: uses, contract: "Triage text through the Vercel route for material items.", views: [llm] }
  - { from: "agent:A2", to: "llm-role:R2", kind: uses, contract: "Summaries, text only.", views: [llm] }
  - { from: "agent:A3", to: "table:main.regime_daily", kind: data, contract: "Writes the daily regime.", views: [agents] }
  - { from: "agent:A4", to: "table:main.indicator_daily", kind: data, contract: "Writes indicators.", views: [agents] }
  - { from: "agent:A4", to: "table:main.pattern_daily", kind: data, contract: "Writes validated patterns.", views: [agents] }
  - { from: "agent:A5", to: "table:main.signal", kind: data, contract: "Writes signals.", views: [agents] }
  - { from: "agent:A5", to: "table:main.decision_card", kind: data, contract: "Writes decision cards.", views: [agents] }
  - { from: "agent:A6", to: "table:main.lesson", kind: data, contract: "Writes lessons.", views: [learning] }
  - { from: "agent:A6", to: "llm-role:R3", kind: uses, contract: "Wording of lessons.", views: [llm] }
  - { from: "agent:A7", to: "table:main.critique", kind: data, contract: "Writes critiques.", views: [learning, agents] }
  - { from: "agent:A7", to: "llm-role:R3", kind: uses, contract: "Concerns worded by a different provider.", views: [llm] }
  - { from: "agent:A8", to: "llm-role:R5", kind: uses, contract: "Narrative from structured facts.", views: [llm, email] }
  - { from: "agent:A8", to: "table:main.evening_review", kind: data, contract: "Stores the Evening Review.", views: [learning] }
  - { from: "agent:A9", to: "group:cortex-angles", kind: data, contract: "Computes every angle on the as-of world.", views: [cortex] }
  - { from: "group:cortex-angles", to: "group:cortex-gates", kind: data, contract: "Angle values enter the ordered gates.", views: [cortex] }
  - { from: "group:cortex-gates", to: "group:cortex-score", kind: data, contract: "Candidates that pass the gates are scored.", views: [cortex] }
  - { from: "group:cortex-score", to: "group:cortex-states", kind: data, contract: "Scores are applied per family state.", views: [cortex] }
  - { from: "group:cortex-states", to: "group:cortex-ledger", kind: data, contract: "Decisions (shadow, blocked, live) are appended.", views: [cortex] }
  - { from: "group:cortex-ledger", to: "table:main.cortex_ledger_cell", kind: data, contract: "Ledger cells.", views: [cortex, data] }
  - { from: "group:lane-a", to: "table:main.lesson", kind: data, contract: "Lessons and nudges.", views: [learning] }
  - { from: "group:lane-b", to: "table:main.challenger", kind: data, contract: "Challengers and their lifecycle.", views: [learning] }
  - { from: "group:lane-b", to: "group:cortex-states", kind: data, contract: "Promoted challengers change family state.", views: [learning] }
  - { from: "group:experts-stage", to: "table:main.screening_run", kind: data, contract: "One screening run per week and market; results are append-only.", views: [learning, data] }
  - { from: "group:experts-stage", to: "table:main.expert_proposal", kind: data, contract: "Every proposal outcome is a row; a dormant F7 gate is a row.", views: [learning, data] }
  - { from: "group:experts-stage", to: "table:main.expert_call_outcome", kind: data, contract: "Paper-call outcomes versus the market, once per call.", views: [learning, data] }
  - { from: "group:experts-stage", to: "group:lane-b", kind: data, contract: "The only path to trading: createChallenger, after which the v1 rules apply unchanged.", views: [learning] }
  - { from: "group:experts-stage", to: "group:kb-documents", kind: data, contract: "Expert and technique documents under knowledge/common, no red-flag text.", views: [learning, data] }
  - { from: "group:kb-documents", to: "service:data-repo", kind: data, contract: "Archived by the kb-archive workflow.", views: [learning, data] }
